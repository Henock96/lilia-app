name: lilia_app
description: "Marketplace restaurants, cuisine fais maison, patisserie"

version: 1.2.6+31

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  firebase_auth: ^6.5.2
  flutter_riverpod: ^3.3.2
  google_sign_in: ^7.2.0
  firebase_core: ^4.10.0
  firebase_analytics: ^12.4.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  dio: ^5.9.2
  iconsax: ^0.0.8
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.2.2
  cloudinary_public: ^0.23.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image: ^4.9.1
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1
  carousel_slider: ^5.1.2
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.1.1
  google_maps_flutter: ^2.17.1
  geolocator: ^13.0.4
  socket_io_client: ^3.1.2
  sentry_flutter: ^9.20.0
  flutter_animate: ^4.5.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  # `riverpod_lint` doit être déclaré dans le bloc `plugins:` de
  # `analysis_options.yaml` pour tourner. Il était présent ici depuis des mois
  # sans qu'aucune de ses règles ne s'exécute.
  riverpod_lint: ^3.1.4
  build_runner: ^2.15.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo1.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF8F6"
# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  assets:
    - assets/images/

  # Polices embarquées.
  #
  # Le thème utilise Oswald, Fraunces, Girassol et Inter via `GoogleFonts.*`,
  # qui les téléchargeait depuis fonts.gstatic.com au premier lancement : de la
  # latence au démarrage sur la 4G de Brazzaville, et des polices de repli hors
  # ligne. Déclarées ici, `google_fonts` les résout depuis le bundle et
  # `allowRuntimeFetching = false` (main.dart) interdit tout appel réseau.
  #
  # Toutes sous licence SIL Open Font (OFL.txt conservé à côté de chaque .ttf).
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Italic-VariableFont_wght.ttf
          style: italic
        - asset: assets/fonts/lora/Lora-VariableFont_wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-VariableFont.ttf
        - asset: assets/fonts/inter/Inter-Italic-VariableFont.ttf
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/oswald/Oswald-VariableFont.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-VariableFont.ttf
    - family: Girassol
      fonts:
        - asset: assets/fonts/girassol/Girassol-Regular.ttf

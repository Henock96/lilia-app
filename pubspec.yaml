name: lilia_app
description: "Marketplace restaurants, cuisine fais maison, patisserie"

version: 1.3.7+41

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1
  firebase_auth: ^6.7.0
  flutter_riverpod: ^3.4.3
  google_sign_in: ^7.2.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  dio: ^5.11.1
  iconsax: ^0.0.8
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.2.3
  cloudinary_public: ^0.23.1
  cached_network_image: ^4.0.2
  flutter_cache_manager: ^3.4.5
  image: ^4.10.1
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  carousel_slider: ^5.1.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  google_maps_flutter: ^2.18.1
  geolocator: ^14.0.3
  socket_io_client: ^3.1.6
  sentry_flutter: ^9.30.1
  flutter_animate: ^4.5.2
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  # `riverpod_lint` doit être déclaré dans le bloc `plugins:` de
  # `analysis_options.yaml` pour tourner. Il était présent ici depuis des mois
  # sans qu'aucune de ses règles ne s'exécute.
  riverpod_lint: ^3.1.9
  build_runner: ^2.16.1


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/source/logo1.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF8F6"
# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  assets:
    - assets/images/
    # Logo blanc du splash (≤ 30 Ko). `branding/source/` (logo1.jpg, source de
    # l'icône) n'est PAS embarqué : un dossier déclaré n'inclut pas ses
    # sous-dossiers.
    - assets/branding/
    - assets/onboarding/

  # Polices embarquées.
  #
  # Le thème utilise Oswald, Fraunces, Girassol et Inter via `GoogleFonts.*`,
  # qui les téléchargeait depuis fonts.gstatic.com au premier lancement : de la
  # latence au démarrage sur la 4G de Brazzaville, et des polices de repli hors
  # ligne. Déclarées ici, `google_fonts` les résout depuis le bundle et
  # `allowRuntimeFetching = false` (main.dart) interdit tout appel réseau.
  #
  # Toutes sous licence SIL Open Font (OFL.txt conservé à côté de chaque .ttf).
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Italic-VariableFont_wght.ttf
          style: italic
        - asset: assets/fonts/lora/Lora-VariableFont_wght.ttf
    # Inter et Oswald en **statiques**, nommés comme `google_fonts` les cherche
    # (`Inter-SemiBold.ttf`…). Avec les seules polices variables, chaque
    # `GoogleFonts.inter(fontWeight: w600)` échouait (« not found in the
    # application assets ») et retombait sur la famille variable à sa graisse
    # par défaut : les graisses du thème n'étaient jamais rendues. Instances
    # générées depuis les variables (fontTools, wght 400/500/600/700, Inter à
    # opsz 14), réduites aux plages latines, ponctuation, symboles — OFL.
    # Les variables restent dans le dépôt pour `test/helpers/real_fonts.dart`.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/static/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/static/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/static/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/static/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-Italic-VariableFont.ttf
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/oswald/static/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/oswald/static/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/oswald/static/Oswald-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/oswald/static/Oswald-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-VariableFont.ttf
    - family: Girassol
      fonts:
        - asset: assets/fonts/girassol/Girassol-Regular.ttf
